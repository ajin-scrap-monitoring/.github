name: Validate community files

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Community files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: Validate Issue templates
        run: ruby .github/scripts/validate_issue_templates.rb
